<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gates</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>

    <h1>Logic Gates</h1>
    <p>Toggle the inputs on the left, the inputs, and see
        <br>what changes with the outputs.
    </p>
    <br>

    <h2>AND Gate</h2>
    <div class="gate" id="andForm">
        <div class="inputs">
            <input type="checkbox" name="andA" id="andA">
            <input type="checkbox" name="andB" id="andB">
        </div>
        <img src="images/AND_gate.png" alt="AND gate" width="150px" height="80px">
        <input type="checkbox" name="outAND" id="outAND">
    </div>



    <h2>OR Gate</h2>
    <div class="gate" id="orForm">
        <div class="inputs">
            <input type="checkbox" name="orA" id="orA">
            <input type="checkbox" name="orB" id="orB">
        </div>
        <img src="images/OR_gate.png" alt="OR gate" width="150px" height="80px">
        <input type="checkbox" name="outOR" id="outOR" >
    </div>



    <h2>NOT Gate</h2>
    <div class="gate" id="notForm">
        <div class="inputs">
            <input type="checkbox" name="notA" id="notA">
        </div>
        <img src="images/NOT_gate.png" alt="NOT Gate" width="120px" height="80px">
        <input type="checkbox" name="outNot" id="outNOT">
    </form>
    
</body>
</html>
