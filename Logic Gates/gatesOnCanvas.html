<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <script src="canvasScript.js" defer ></script>
    <script src="script.js" defer></script>

</head>
<body>
    <h1>Logic Gates</h1>
    <p>Toggle the inputs on the left, the inputs, and see
    <br>what changes with the outputs.
    </p>
    <br>

    <h2>AND Gate</h2>
    <div class="gate" id="andForm">
        <div class="inputs">
            <input type="checkbox" name="andA" id="andA">
            <input type="checkbox" name="andB" id="andB">
        </div>
        <canvas id="andGate" width="160px" height="80px"></canvas>
        <input type="checkbox" name="outAND" id="outAND">
    </div>
   

    <h2>OR Gate</h2>
    <div class="gate" id="andForm">
        <div class="inputs">
            <input type="checkbox" name="orA" id="orA">
            <input type="checkbox" name="orB" id="orB">
        </div>
        <canvas id="orGate" width="160px" height="80px"></canvas>
        <input type="checkbox" name="outOR" id="outOR">
    </div>
    

    <h2>NOT Gate</h2>
    <div class="gate" id="andForm">
        <div class="inputs">
            <input type="checkbox" name="notA" id="notA">
        </div>
        <canvas id="notGate" width="160px" height="80px"></canvas>
        <input type="checkbox" name="outNOT" id="outNOT">
    </div>
    
    
</body>
</html>
